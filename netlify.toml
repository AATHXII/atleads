# Статичный сайт: сборки нет, публикуем корень репозитория.
[build]
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Исходник Apps Script лежит в репозитории для истории, но на сайте не отдаётся.
[[redirects]]
  from = "/apps-script/*"
  to = "/404.html"
  status = 404
  force = true
